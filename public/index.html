<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RLVNT</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a href="/"><img src="images/logo.png" alt="RLVNT"></a><button id="cartBtn">Cart (<span id="count">0</span>)</button></header>
<section class="hero"><h2>Wear what's relevant.</h2><p>Every piece. 800 EGP.</p></section>
<main><div id="grid" class="grid"></div></main>
<aside id="cart" class="panel hidden"><h3>Your cart</h3><div id="cartItems"></div>
<p><strong>Total: <span id="total">0</span> EGP</strong></p></aside>
<div id="chat" class="chat">
  <div id="log"></div>
  <form id="form"><input id="input" placeholder="Ask for a hoodie, add to cart..." autocomplete="off" maxlength="500"><button>Send</button></form>
</div>
<script src="config.js"></script><script src="app.js"></script>
<footer>RLVNT Streetwear. <a href="policies.html">Policies, shipping, returns and care</a></footer>
</body></html>
